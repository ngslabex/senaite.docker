[buildout]
index = https://pypi.python.org/simple/
extends =
  buildout-base.cfg
extensions = mr.developer

var-dir=/data
user=admin:password

effective-user = senaite
buildout-user = senaite

eggs-directory=eggs
download-cache=../buildout-cache/downloads

parts +=
  zeo
  plonesite
  console_scripts

eggs +=
    senaite.lims
    senaite.patient
    senaite.jsonapi
    senaite.databox
    senaite.storage
    senaite.ldap
    senaite.diagnosis
    senaite.referral
#    senaite.indexer
#    senaite.monkeypatches
    RelStorage
    pg8000
    collective.recipe.plonesite
#    plone.initializer 

# develop =
#    src/plone.initializer
#    src/senaite.indexer
#    src/senaite.monkeypatches

sources = sources
auto-checkout = *

[sources]
senaite.core = git https://github.com/ngslabex/senaite.core.git branch=2.6.4
senaite.app.listing = git https://github.com/ngslabex/senaite.app.listing.git branch=2.x
senaite.app.spotlight = git https://github.com/ngslabex/senaite.app.spotlight.git branch=2.x
senaite.app.supermodel = git https://github.com/ngslabex/senaite.app.supermodel.git branch=2.x
senaite.databox = git https://github.com/ngslabex/senaite.databox.git branch=master
senaite.impress = git https://github.com/ngslabex/senaite.impress.git branch=2.x
senaite.jsonapi = git https://github.com/ngslabex/senaite.jsonapi.git  branch=2.x
senaite.lims = git https://github.com/ngslabex/senaite.lims.git branch=2.x
senaite.storage = git https://github.com/ngslabex/senaite.storage.git branch=2.x
senaite.patient = git https://github.com/ngslabex/senaite.patient.git branch=master
senaite.ldap = git https://github.com/ngslabex/senaite.ldap.git branch=master
senaite.diagnosis = git https://github.com/ngslabex/senaite.diagnosis.git branch=master
senaite.referral = git https://github.com/ngslabex/senaite.referral.git branch=2.x
# senaite.indexer = git https://github.com/ngslabex/senaite.indexer.git branch=main
# senaite.monkeypatches = git https://github.com/ngslabex/senaite.monkeypatches.git branch=main
# plone.initializer = git https://github.com/ngslabex/plone.initializer.git branch=main


[client1]
recipe =

[zeo]
<= zeoserver_base
recipe = plone.recipe.zeoserver
zeo-address = 8080

[instance]
# taken from https://github.com/plone/plone.docker/blob/master/5.2/5.2.5/python2/buildout.cfg
event-log-handler = StreamHandler
event-log-args = (sys.stderr,)
access-log-handler = StreamHandler
access-log-args = (sys.stdout,)
environment-vars =
    TZ Europe/Istanbul

[console_scripts]
recipe = zc.recipe.egg:scripts
eggs = senaite.core

[plonesite]
recipe = collective.recipe.plonesite
instance = instance
site-id = senaite
profiles-initial = Products.CMFPlone:dependencies
profiles =
    senaite.lims:default
#    plone.initializer:default
#    senaite.indexer:default
#    senaite.monkeypatches:default
upgrade-portal = False
upgrade-all-profiles = False
enabled = False

[versions]
setuptools = 44.1.1
#zc.buildout =
#setuptools = 42.0.2
#senaite.lims = 2.5.0
zc.buildout=3.3
Werkzeug = 1.0.1
cryptography = 3.3.2
bobtemplates.plone=5.2.2
isort=4.3.21
regex = 2021.3.17
#senaite.core = 2.5.0
et-xmlfile = 1.0.1
RelStorage = 2.1.1
pg8000 = 1.12.5
perfmetrics = 3.3.0
zodbpickle = 2.6
BTrees = 4.11.3