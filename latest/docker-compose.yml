version: "3.9"

services:

  zeo:
    image: ersankose/senaite:v2.6.3
    command: zeo
    volumes:
      - data:/data
    environment:
      ZEO_STORAGE: "1"
      ZEO_CLIENT_CACHE_SIZE: "128MB"
    restart: unless-stopped

  instance1:
    image: ersankose/senaite:v2.6.3
    ports:
      - 8081:8080
    depends_on:
      - zeo
    environment:
      ZEO_ADDRESS: "zeo:8080"
      ZEO_READ_ONLY: "false"
      ZEO_CLIENT_READ_ONLY_FALLBACK: "true"
      ZEO_SHARED_BLOB_DIR: "off"
      RELSTORAGE_ADAPTER_OPTIONS: >
        type postgresql,
        dsn dbname='senaite' user='senaite' password='senaite' host='postgresql',
        driver pg8000
      RELSTORAGE_KEEP_HISTORY: "false"
      RELSTORAGE_BLOB_DIR: "/home/senaite/senaitelims/blobstorage"
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
    volumes:
      - data:/data
    restart: unless-stopped

  instance2:
    image: ersankose/senaite:v2.6.3
    ports:
      - 8082:8080
    depends_on:
      - zeo
    environment:
      ZEO_ADDRESS: "zeo:8080"
      ZEO_READ_ONLY: "false"
      ZEO_CLIENT_READ_ONLY_FALLBACK: "true"
      ZEO_SHARED_BLOB_DIR: "off"
      RELSTORAGE_ADAPTER_OPTIONS: >
        type postgresql,
        dsn dbname='senaite' user='senaite' password='senaite' host='postgresql',
        driver pg8000
      RELSTORAGE_KEEP_HISTORY: "false"
      RELSTORAGE_BLOB_DIR: "/home/senaite/senaitelims/blobstorage"
      ADMIN_USER: admin
      ADMIN_PASSWORD: password
    volumes:
      - data:/data
    restart: unless-stopped

  postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: senaite
      POSTGRES_USER: senaite
      POSTGRES_PASSWORD: senaite
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  data:
    external: true
  pgdata: